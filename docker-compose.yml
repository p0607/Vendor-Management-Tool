services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vendor-management-db
    environment:
      POSTGRES_DB: Vendor_Management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Postgres0607@}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vendor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: vendor-management-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - vendor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  api:
    build:
      context: ./Vendor_Management_BackEnd
      dockerfile: Dockerfile
    container_name: vendor-management-api
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: Vendor_Management
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-Postgres0607@}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: ${FRONTEND_URL:-http://40.67.147.19}
    ports:
      - "5001:5001"
    volumes:
      - ./Vendor_Management_BackEnd/uploads:/app/uploads
      - ./Vendor_Management_BackEnd/logs:/app/logs
    networks:
      - vendor-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: vendor-management-frontend
    environment:
      - REACT_APP_API_URL=http://40.67.147.19
    ports:
      - "3000:80"
    networks:
      - vendor-network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Main Entry Point)
  nginx:
    image: nginx:alpine
    container_name: vendor-management-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    networks:
      - vendor-network
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vendor-network:
    driver: bridge
