version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vmt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vendor_management}
      POSTGRES_USER: ${POSTGRES_USER:-vmt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vmt_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - ./VMTdb.backup:/docker-entrypoint-initdb.d/VMTdb.backup:ro
    ports:
      - "5432:5432"
    networks:
      - vmt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vmt_user} -d ${POSTGRES_DB:-vendor_management}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Node.js Backend API
  api:
    build:
      context: ./Vendor_Management_BackEnd
      dockerfile: Dockerfile
      target: production
    container_name: vmt_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-vendor_management}
      DB_USER: ${POSTGRES_USER:-vmt_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vmt_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_PATH: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5001:5001"
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vmt_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  client:
    build:
      context: ./Vendor_Management_FrontEnd
      dockerfile: Dockerfile
      target: production
    container_name: vmt_client
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
      REACT_APP_ENVIRONMENT: production
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - vmt_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional - for production with SSL)
  nginx:
    image: nginx:alpine
    container_name: vmt_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - client
      - api
    networks:
      - vmt_network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  vmt_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
